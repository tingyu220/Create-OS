<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative OS · 我的作品</title><link rel="stylesheet" href="/styles.css"></head>
<body id="bookshelf-page">
<a class="skip-link" href="#bookshelf-main">跳到作品列表</a>
<div class="library-shell">
  <aside class="library-sidebar"><a class="library-brand" href="/">Creative OS</a><p class="brand-note">让好故事持续发生</p><nav aria-label="作品导航"><a class="nav-item active" href="#all-books">▤　我的作品</a><a class="nav-item" href="#recent-section">◷　最近打开</a></nav><div class="library-sidebar-foot"><a href="/overview">默认作品摘要</a><a href="/inspector">运行诊断 ↗</a><small>所有稿件，留在自己的作品里。</small></div></aside>
  <main id="bookshelf-main" class="library-main">
    <header class="library-header"><div><p class="eyebrow">你的创作空间</p><h1>我的作品</h1></div><div class="library-tools"><label class="sr-only" for="book-search">搜索作品名称</label><input id="book-search" type="search" placeholder="搜索作品名称…" autocomplete="off"><a id="new-book" class="primary-link" href="/story">＋ 新建小说</a></div></header>
    <p id="legacy-entry" class="notice" hidden></p>
    <div class="issues-entry"><button id="view-issues" type="button" aria-haspopup="dialog" aria-controls="issues-panel">查看并处理作品问题</button></div>
    <section id="recent-section"><div class="section-heading"><h2>最近打开</h2><button id="refresh-books" type="button">刷新</button></div><p id="recent-status" class="muted" role="status"></p><div id="recent-books" class="recent-grid"></div><p id="recent-empty" class="empty-state" hidden>还没有最近打开的作品，从下方选择一本开始。</p></section>
    <section id="all-books"><div class="section-heading"><h2>全部作品</h2><span id="book-total" class="muted"></span></div><p id="catalog-status" class="muted" role="status">正在读取作品目录…</p><p id="catalog-warning" class="notice" hidden></p><div class="book-table"><div class="book-table-head"><span>书名</span><span>已有稿件</span><span>最近打开</span><span>打开</span></div><div id="book-list"></div></div><p id="books-empty" class="empty-state" hidden></p><div class="pagination"><button id="previous-page" type="button" disabled>上一页</button><span id="page-status" class="muted"></span><button id="next-page" type="button" disabled>下一页</button></div></section>
    <footer class="library-footer">从一个念头，到属于你的故事。<a href="/story">开始一本新书 →</a></footer>
  </main>
</div>
<dialog id="issues-panel" class="issues-panel" aria-labelledby="issues-title" aria-describedby="issues-summary">
  <header class="section-heading"><h2 id="issues-title" tabindex="-1">作品问题检查</h2><button id="close-issues" type="button" aria-label="关闭作品问题检查">关闭</button></header>
  <p class="muted">逐项查看原因和影响；目录整理需要先预览，再由你确认。</p>
  <div class="issue-actions"><button id="recheck-issues" type="button">重新检查</button><button id="more-issues" type="button" disabled>检查更多作品</button></div>
  <p id="issues-summary" role="status" aria-live="polite"></p><div id="issues-list"></div>
  <p id="migration-note" class="notice" role="status" aria-live="polite"></p>
  <section id="migration-preview" class="migration-detail" hidden aria-labelledby="migration-preview-title">
    <h3 id="migration-preview-title" tabindex="-1">确认目录整理</h3><p id="migration-preview-impact"></p><pre id="migration-preview-details"></pre>
    <label class="migration-consent"><input id="migration-confirm-check" type="checkbox">已了解影响并确认先备份再迁移</label>
    <div class="issue-actions"><button id="cancel-migration-preview" type="button">取消</button><button id="confirm-migration" type="button" disabled>确认执行</button></div>
  </section>
  <section id="migration-operation" class="migration-detail" hidden aria-label="目录整理状态">
    <h3 id="migration-status" role="status" aria-live="polite"></h3><pre id="migration-operation-details"></pre><p id="migration-reload" class="muted"></p>
    <div class="issue-actions"><button id="refresh-migration-status" type="button">重新读取状态</button><button id="reconcile-migration" type="button" hidden>核对中断状态</button><button id="continue-migration" type="button" hidden>预览并确认继续</button><a id="migration-open" class="book-open" hidden>重新打开作品</a></div>
  </section>
</dialog>
<script src="/bookshelf-issues.js"></script><script src="/app.js"></script>
</body></html>
